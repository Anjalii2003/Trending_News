# News Engine - live, all-country. Start/stop/monitor with deploy/news-ctl.sh (documented in docs/NEWS_ENGINE.md).
#   news-ingest     scheduled incremental processing (reads PostgreSQL labels + OpenSearch, writes only its own state + schema news_engine)
#   news-dashboard  Trending page + advanced dashboard + live processing summary (read-only everywhere)
# ALL derived data lives in the PostgreSQL schema `news_engine`; the volume only holds the run lock, heartbeat and the relevance reference.
# Secrets live in deploy/news.env and deploy/dashboard.env (generated by deploy/bootstrap_pg.py; git-ignored, mode 600).
name: news-engine

x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

services:
  news-ingest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEWS_GPU: ${NEWS_GPU:-0}
    image: news-engine:latest
    container_name: news-ingest
    command: ["python", "scripts/news_service.py", "run"]
    env_file: [news.env]
    environment:
      NEWS_STATE_DIR: /state
      NEWS_SCOPE_NAME: all
      NEWS_INTERVAL_MINUTES: ${NEWS_INTERVAL_MINUTES:-60}          # incremental update every N minutes once the catch-up is complete (minimum 0.5)
      NEWS_RUN_AT_UTC: ${NEWS_RUN_AT_UTC:-}                         # optional: HH:MM (UTC) for ONE update a day instead of every interval
      NEWS_CATCHUP_DAYS_PER_CYCLE: ${NEWS_CATCHUP_DAYS_PER_CYCLE:-5}
      NEWS_START_DATE: ${NEWS_START_DATE:-}                         # normally empty: the day after the last processed day
      NEWS_CLUSTER_DEVICE: ${NEWS_CLUSTER_DEVICE:-auto}
    volumes:
      - news_state:/state
      - ../data/geo:/app/data/geo:ro
      - ../data/publisher_registry.csv:/app/data/publisher_registry.csv:ro
      - ../data/taxonomy.json:/app/data/taxonomy.json:ro
    healthcheck:
      test: ["CMD", "python", "scripts/news_service.py", "health"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    stop_grace_period: 300s          # let a running cycle reach its next safe point (checkpoints make an interrupted one resumable anyway)
    logging: *logging

  news-dashboard:
    image: news-engine:latest
    container_name: news-dashboard
    command: ["python", "UI/news_server.py", "8878", "--host", "0.0.0.0"]
    env_file: [dashboard.env]
    ports:
      - "10.10.180.68:${NEWS_DASHBOARD_PORT:-8880}:8878"              # reachable via this host's LAN address
    volumes:
      - ../data/geo:/app/data/geo:ro
      - ../data/publisher_registry.csv:/app/data/publisher_registry.csv:ro
      - ../data/taxonomy.json:/app/data/taxonomy.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8878/api/news/health', timeout=10).status == 200 else 1)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on: {news-ingest: {condition: service_started}}
    logging: *logging

volumes:
  news_state:
    name: news_engine_state          # run lock, service heartbeat, relevance reference file - persists across restarts/rebuilds
