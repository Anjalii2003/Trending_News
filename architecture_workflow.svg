<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#101c32"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#72b7e8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#62d6b3"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill:#edf4ff; }
      .title { font-size:50px; font-weight:750; }
      .subtitle { font-size:23px; fill:#b6c8dc; }
      .section { font-size:28px; font-weight:750; }
      .label { font-size:22px; font-weight:700; }
      .body { font-size:19px; fill:#d9e5f2; }
      .small { font-size:17px; fill:#b8cadb; }
      .panel { fill:#111f34; stroke:#304661; stroke-width:2; }
      .card { fill:#172941; stroke:#3d5876; stroke-width:2; }
      .source { fill:#172d43; stroke:#4f7c9d; stroke-width:2; }
      .process { fill:#18302f; stroke:#478f80; stroke-width:2; }
      .store { fill:#24233f; stroke:#7969a9; stroke-width:2; }
      .output { fill:#17302f; stroke:#4f9a8b; stroke-width:2; }
      .line { fill:none; stroke:#72b7e8; stroke-width:5; marker-end:url(#arrow); }
      .lineGreen { fill:none; stroke:#62d6b3; stroke-width:5; marker-end:url(#arrowGreen); }
      .green { fill:#77e0be; }
      .blue { fill:#83c4ff; }
      .gold { fill:#ffd17b; }
    </style>
  </defs>

  <rect width="2400" height="1500" fill="url(#bg)"/>
  <rect width="2400" height="170" fill="#14233b"/>
  <text x="65" y="78" class="title">NEWS TRENDING &amp; EMERGING EVENTS</text>
  <text x="68" y="122" class="subtitle">Current architecture · read-only sources · resumable scheduled ingestion · News analytics</text>

  <!-- Live invariant strip -->
  <rect x="55" y="205" width="2290" height="95" rx="18" fill="#16293b" stroke="#38536f" stroke-width="2"/>
  <text x="85" y="244" class="label gold">LIVE GUARANTEES</text>
  <text x="85" y="278" class="small">Source systems are read-only</text>
  <text x="430" y="278" class="small">Derived writes are isolated in PostgreSQL schema news_engine</text>
  <text x="1125" y="278" class="small">One cycle at a time · checkpoints make runs resumable</text>
  <text x="1870" y="278" class="small">Dashboard and API are read-only</text>

  <!-- Sources -->
  <rect x="55" y="330" width="470" height="750" rx="22" class="panel"/>
  <text x="85" y="382" class="section blue">1 · READ-ONLY SOURCES</text>

  <rect x="85" y="420" width="410" height="155" rx="16" class="source"/>
  <text x="110" y="460" class="label blue">Source PostgreSQL</text>
  <text x="110" y="497" class="body">Labels, IDs and publication dates</text>
  <text x="110" y="530" class="small">Taxonomy and provenance</text>
  <text x="110" y="555" class="small">SELECT-only access</text>

  <rect x="85" y="600" width="410" height="155" rx="16" class="source"/>
  <text x="110" y="640" class="label blue">OpenSearch</text>
  <text x="110" y="677" class="body">Metadata, embeddings and locations</text>
  <text x="110" y="710" class="small">Read/search operations only</text>
  <text x="110" y="735" class="small">Article content is not copied locally</text>

  <rect x="85" y="780" width="410" height="95" rx="16" class="source"/>
  <text x="110" y="820" class="label blue">No article content copied locally</text>
  <text x="110" y="852" class="small">Metadata and derived signals stay in PostgreSQL</text>

  <!-- Ingestion processing -->
  <rect x="555" y="330" width="870" height="750" rx="22" class="panel"/>
  <text x="585" y="382" class="section green">2 · news-ingest</text>
  <text x="585" y="414" class="small">Docker scheduler · hourly incremental runs · resumable checkpointed catch-up</text>

  <rect x="585" y="445" width="250" height="132" rx="16" class="process"/>
  <text x="610" y="485" class="label green">Discover &amp; hydrate</text>
  <text x="610" y="520" class="body">Check watermark and published days</text>
  <text x="610" y="550" class="small">Join source metadata</text>
  <path d="M835 511 H875" class="lineGreen"/>

  <rect x="875" y="445" width="250" height="132" rx="16" class="process"/>
  <text x="900" y="485" class="label green">Ingest &amp; validate</text>
  <text x="900" y="520" class="body">Dedupe · date · geography</text>
  <text x="900" y="550" class="small">Commit one published day atomically</text>
  <path d="M1125 511 H1165" class="lineGreen"/>

  <rect x="1165" y="445" width="230" height="132" rx="16" class="process"/>
  <text x="1190" y="485" class="label green">Late-label resolver</text>
  <text x="1190" y="520" class="body">Attach labels that arrive later</text>
  <text x="1190" y="550" class="small">Keep unattributed articles</text>

  <rect x="585" y="615" width="810" height="180" rx="16" class="process"/>
  <text x="610" y="655" class="label green">Event clustering</text>
  <text x="610" y="692" class="body">Embeddings grouped into related events</text>
  <text x="610" y="725" class="small">Stable IDs · incremental event updates</text>

  <rect x="585" y="830" width="810" height="210" rx="16" class="process"/>
  <text x="610" y="870" class="label green">Trending analysis</text>
  <text x="610" y="910" class="body">Compute AOI trends and event signals</text>
  <text x="610" y="946" class="body">Rank stories and identify emerging events</text>
  <text x="610" y="982" class="body">Generate alerts and new developments</text>
  <path d="M990 577 V615" class="lineGreen"/>
  <path d="M990 795 V830" class="lineGreen"/>

  <!-- Storage -->
  <rect x="1455" y="330" width="890" height="750" rx="22" class="panel"/>
  <text x="1485" y="382" class="section">3 · DERIVED NEWS DATA</text>
  <text x="1485" y="414" class="small">PostgreSQL · schema news_engine · no source-table writes</text>

  <rect x="1485" y="445" width="390" height="165" rx="16" class="store"/>
  <text x="1510" y="485" class="label">Ingestion state</text>
  <text x="1510" y="523" class="body">Article facts and source identity</text>
  <text x="1510" y="556" class="small">Checkpoints · runs · watermarks · state</text>
  <text x="1510" y="585" class="small">Processed days and service health</text>

  <rect x="1910" y="445" width="405" height="165" rx="16" class="store"/>
  <text x="1935" y="485" class="label">Events and clusters</text>
  <text x="1935" y="523" class="body">Event and article membership</text>
  <text x="1935" y="556" class="small">Cluster IDs and centroids</text>
  <text x="1935" y="585" class="small">Stable across resumable runs</text>

  <rect x="1485" y="645" width="390" height="165" rx="16" class="store"/>
  <text x="1510" y="685" class="label">AOI analytics</text>
  <text x="1510" y="723" class="body">AOI definitions and daily analytics</text>
  <text x="1510" y="756" class="small">Counts, trends and statistical evidence</text>
  <text x="1510" y="785" class="small">AOI-day coverage and metric metadata</text>

  <rect x="1910" y="645" width="405" height="165" rx="16" class="store"/>
  <text x="1935" y="685" class="label">Signals and delivery</text>
  <text x="1935" y="723" class="body">event_metrics · alerts · developments</text>
  <text x="1935" y="756" class="small">story · story_event · trending_ranking</text>
  <text x="1935" y="785" class="small">Dashboard snapshots remain database-backed</text>

  <rect x="1485" y="845" width="830" height="195" rx="16" class="store"/>
  <text x="1510" y="885" class="label">Persistent service state</text>
  <text x="1510" y="923" class="body">Docker volume: news_engine_state</text>
  <text x="1510" y="956" class="small">Run lock · heartbeat · relevance reference</text>
  <text x="1510" y="989" class="small">The lock prevents duplicate container or host runs; every data write remains in PostgreSQL</text>

  <!-- Arrow from processing to storage -->
  <path d="M1395 935 H1440 Q1455 935 1455 920" class="lineGreen"/>

  <!-- Dashboard -->
  <rect x="555" y="1110" width="1790" height="285" rx="22" class="panel"/>
  <text x="585" y="1162" class="section green">4 · news-dashboard</text>
  <text x="585" y="1194" class="small">Read-only API and web UI · served by a separate container</text>

  <rect x="585" y="1228" width="390" height="125" rx="16" class="output"/>
  <text x="610" y="1268" class="label green">UI / Trending page</text>
  <text x="610" y="1302" class="body">Rankings, stories, AOIs, methodology</text>
  <text x="610" y="1332" class="small">Browser-based charts and filters</text>

  <rect x="1010" y="1228" width="390" height="125" rx="16" class="output"/>
  <text x="1035" y="1268" class="label green">News API</text>
  <text x="1035" y="1302" class="body">/api/news/* read-only endpoints</text>
  <text x="1035" y="1332" class="small">Health, status, rankings, stories and AOIs</text>

  <rect x="1435" y="1228" width="390" height="125" rx="16" class="output"/>
  <text x="1460" y="1268" class="label green">Operator</text>
  <text x="1460" y="1302" class="body">news-ctl start / stop / status</text>
  <text x="1460" y="1332" class="small">Scheduled ingestion remains separate from dashboard</text>

  <rect x="1860" y="1228" width="455" height="125" rx="16" fill="#203b50" stroke="#477b8b" stroke-width="2"/>
  <text x="1885" y="1268" class="label green">Delivery</text>
  <text x="1885" y="1302" class="body">LAN-bound dashboard</text>
  <text x="1885" y="1332" class="small">No source credentials exposed to the browser</text>

  <path d="M525 480 H555" class="line"/>
  <path d="M525 665 H555" class="line"/>
  <path d="M2110 1040 V1110" class="lineGreen"/>

  <text x="55" y="1435" class="small">Scope: News Trending only. The former social-media pipeline, geopolitics enrichment and legacy metric workflows are not part of this architecture.</text>
</svg>
